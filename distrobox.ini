[sys-ops]
image=ghcr.io/jnbntc/sys-ops:latest
pull=true
root=false
replace=true
init=false

[iot-dev]
image=ghcr.io/jnbntc/iot-dev:latest
pull=true
root=false
replace=true
additional_flags="--device /dev/bus/usb:/dev/bus/usb:rwm --group-add keep-groups"
init=false

[android-ops]
image=ghcr.io/jnbntc/android-ops:latest
pull=true
root=false
replace=true
additional_flags="--device /dev/bus/usb:/dev/bus/usb:rwm --group-add keep-groups"
init=false

[ia-dev]
image=ghcr.io/jnbntc/ia-dev:latest
pull=true
root=false
replace=true
additional_flags="--device /dev/dri:/dev/dri:rwm"
init=false

[books-ops]
image=ghcr.io/jnbntc/books-ops:latest
pull=true
root=false
replace=true
additional_flags="--device /dev/bus/usb:/dev/bus/usb:rwm --group-add keep-groups"
init=false
exported_apps="calibre"
exported_bins="/usr/bin/calibredb /usr/bin/ebook-convert /usr/local/bin/books-tor"

[re-ops]
image=ghcr.io/jnbntc/re-ops:latest
pull=true
root=false
replace=true
init=false
unshare_netns=true

[gns3-client]
image=ghcr.io/jnbntc/gns3-client:latest
pull=true
root=false
replace=true
init=false

[net-ops]
image=ghcr.io/jnbntc/net-ops:latest
pull=true
root=true
replace=true
network=host
init=false

[sec-ops]
image=ghcr.io/jnbntc/sec-ops:latest
pull=true
root=true
replace=true
init=false
unshare_netns=true
additional_flags="--cap-add=NET_ADMIN --device /dev/net/tun"
volume=~/.local/share/sec-workspace:/sec:rw
volume=~/.local/share/SecLists:/opt/seclists:ro
