# =====================================================================
# STACK DE HERRAMIENTAS Y ENTORNOS - FEDORA ATOMIC
# =====================================================================

# --- 1. TOOLKIT DE REDES Y AUDITORÍA (Rootful / Hardware Access) ---
[net-ops]
image=localhost/custom/net-ops:latest
root=true
network=host
pull=false
init=false
additional_flags="--cap-add=NET_ADMIN --cap-add=NET_RAW --cap-add=NET_BIND_SERVICE --security-opt label=disable"

# --- 2. ADMINISTRACIÓN DE SISTEMAS Y SCRIPTING (Rootless) ---
[pwsh-admin]
image=localhost/custom/pwsh-admin:latest
root=false
pull=false
init=false
additional_flags="--env LANG=C.UTF-8"

# --- 3. DESARROLLO Y TELEMETRÍA IOT / ESP32 (Rootless + USB/Serial Dinámico) ---
[iot-dev]
image=localhost/custom/iot-dev:latest
root=false
pull=false
# Mapeo dinámico del bus USB para flasheo (evita caídas si el dispositivo no está enchufado en el build) y herencia de grupos de hardware
additional_flags="--device=/dev/bus/usb:/dev/bus/usb:rwm --group-add keep-groups"

# --- 4. INTELIGENCIA ARTIFICIAL Y AGENTES (Rootless + GPU) ---
[ia-dev]
image=localhost/custom/ia-dev:latest
root=false
pull=false
# Descomentar según hardware de aceleración (ej. DRI para AMD/Intel o NVIDIA)
# additional_flags="--device /dev/dri:/dev/dri --security-opt label=disable"

# --- 5. OPERACIONES Y EDICIÓN MULTIMEDIA (Rootless) ---
[media-ops]
image=localhost/custom/media-ops:latest
root=false
pull=false
