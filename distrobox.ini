[net-ops]
image=ghcr.io/jnbntc/net-ops:latest
pull=true
root=true
replace=true
network=host
init=false

[pwsh-admin]
image=ghcr.io/jnbntc/pwsh-admin:latest
pull=true
root=false
replace=true
init=false

[iot-dev]
image=ghcr.io/jnbntc/iot-dev:latest
pull=true
root=false
replace=true
additional_flags="--device /dev/bus/usb:/dev/bus/usb:rwm --group-add keep-groups"
init=false

[ia-dev]
image=ghcr.io/jnbntc/ia-dev:latest
pull=true
root=false
replace=true
additional_flags="--device /dev/dri:/dev/dri:rwm"
init=false

[media-ops]
image=ghcr.io/jnbntc/media-ops:latest
pull=true
root=false
replace=true
init=false

[re-ops]
image=ghcr.io/jnbntc/re-ops:latest
pull=true
root=false
replace=true
init=false
unshare_net=true

[book-ops]
image=ghcr.io/jnbntc/book-ops:latest
pull=true
root=false
replace=true
additional_flags="--device /dev/bus/usb:/dev/bus/usb:rwm --group-add keep-groups"
init=false
init_hooks="mkdir -p ~/.tor_data && pgrep -x tor >/dev/null || tor --RunAsDaemon 1 --DataDirectory ~/.tor_data || true"

[gns3-client]
image=ghcr.io/jnbntc/gns3-client:latest
pull=true
root=false
replace=true
init=false
#exported_apps="gns3 wireshark"
