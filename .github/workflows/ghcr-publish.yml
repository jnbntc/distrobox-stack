name: OCI Build & Publish to GHCR

on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [ "main", "master" ]
    paths:
      - 'dockerfiles/**'
      - 'scripts/**'
      - '.github/workflows/ghcr-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Publish OCI Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sys-ops
            context: rootless
          - image: iot-dev
            context: rootless
          - image: android-ops
            context: rootless
          - image: ia-dev
            context: rootless
          - image: books-ops
            context: rootless
          - image: gns3-client
            context: rootless
          - image: re-ops
            context: rootless
          - image: net-ops
            context: rootful
          - image: sec-ops
            context: rootful

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCI Image (${{ matrix.image }})
        run: |
          podman build \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}:${{ github.sha }} \
            --file dockerfiles/Containerfile.${{ matrix.image }} \
            .

      - name: Smoke test OCI image
        run: |
          case "${{ matrix.image }}" in
            sys-ops)
              podman run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sys-ops:latest sh -lc '
                set -e
                pwsh --version
                python3 --version
                command -v kinit
                command -v dig
                command -v nslookup
                command -v host
                command -v ip
                command -v jq
              '
              ;;
            iot-dev)
              podman run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/iot-dev:latest sh -lc '
                set -e
                python3 --version
                command -v pio
                command -v platformio
                command -v lsusb
                command -v udevadm
                pio --version | grep -F "PlatformIO Core, version 6.2.0"
                platformio --version | grep -F "PlatformIO Core, version 6.2.0"
                export HOME=/tmp/iot-user
                export XDG_DATA_HOME=/tmp/iot-xdg
                mkdir -p "$HOME" "$XDG_DATA_HOME"
                pio system info
                test -d "$XDG_DATA_HOME/platformio"
                test ! -e "$HOME/.platformio"
              '
              ;;
            android-ops)
              podman run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/android-ops:latest sh -lc '
                set -e
                command -v adb
                command -v fastboot
                command -v lsusb
                command -v jq
                adb version
                fastboot --version
              '
              ;;
            books-ops)
              podman run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/books-ops:latest sh -lc 'command -v calibre && command -v calibredb && command -v ebook-convert && command -v tor && command -v books-tor && command -v lsusb && tor -f /etc/tor/books-ops/torrc --defaults-torrc /etc/tor/books-ops/torrc-defaults --verify-config'
              ;;
            re-ops)
              podman run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/re-ops:latest bash -lc '
                set -e
                test -x "$JAVA_HOME/bin/java"
                test -x "$JAVA_HOME/bin/javac"
                java -version
                javac -version
                out="$(/opt/ghidra/support/analyzeHeadless 2>&1 || true)"
                printf "%s\n" "$out"
                grep -q "Headless Analyzer Usage:" <<<"$out"
              '
              ;;
            sec-ops)
              podman run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sec-ops:latest sh -lc '
                set -e
                command -v openvpn
                command -v pwncat-cs
                test -x /opt/static_tools/linpeas.sh
                test -s /opt/static_tools/winPEASx64.exe
              '
              ;;
          esac

      - name: Push to GHCR
        run: |
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}:latest
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}:${{ github.sha }}
