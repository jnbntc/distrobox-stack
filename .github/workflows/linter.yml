name: Infra Structure & Code Validation

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'dockerfiles/**'
      - 'scripts/**'
      - 'Makefile'
      - '*.ini'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-shell:
    name: ShellCheck (Bash Scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck on scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: 'scripts'
          # Solo falla si hay errores críticos de sintaxis o lógica en Bash (ignora avisos de estilo)
          severity: 'error'

  lint-containers:
    name: Hadolint (Containerfiles)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Hadolint against Containerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: dockerfiles/Containerfile.*
          # Exclusiones diseñadas para entornos locales rolling-release:
          # DL3006: Always tag the version of an image explicitly
          # DL3007: Using latest is prone to errors
          # DL3008: Pin versions in apt get install (Debian/Ubuntu para IoT)
          # DL3041: Specify version with dnf install (Fedora)
          # DL3059: Multiple consecutive `RUN` instructions
          ignore: DL3006,DL3007,DL3008,DL3041,DL3059
